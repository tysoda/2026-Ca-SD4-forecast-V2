name: Update Ballot Returns

on:
  schedule:
    # Every 2 hours at :17. GitHub delays or drops scheduled runs at busy times —
    # especially on the hour — so an off-peak minute and a shorter interval mean
    # a new SOS report is picked up within a few hours even when runs are skipped.
    - cron: '17 */2 * * *'
  workflow_dispatch:  # Allow manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Fetch SOS ballot return reports
        # Checks the undated bsr-statistics.xlsx and the dated
        # bsr-statistics-MM-DD-YYYY.xlsx files for the last 10 days, and appends
        # any report dates not already in ballot_returns.csv (backfills gaps).
        run: python3 fetch_ballot_returns.py --auto --days 10

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ballot_returns.csv
          if git diff --cached --quiet; then
            echo "No changes to commit — ballot_returns.csv already up to date."
          else
            SNAPSHOT=$(python3 -c "
          import csv
          print(max(r['snapshot_date'] for r in csv.DictReader(open('ballot_returns.csv'))))
          ")
            git commit -m "chore: update ballot returns for ${SNAPSHOT} [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
