name: Update Optiq Crosstabs

on:
  schedule:
    # Run at 19:00 UTC (12:00 PM PDT / 11:00 AM PST) every day during election season
    - cron: '0 19 * * *'
  workflow_dispatch:   # allow manual trigger

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Fetch Optiq crosstab snapshot
        run: python3 fetch_optiq_crosstabs.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add optiq_crosstabs.csv
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Optiq crosstab snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
