name: SOS inspect (one-off)
on:
  push:
    branches: [sos-inspect]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install openpyxl
      - run: python3 scripts/sos_inspect.py
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sos_archive
          git commit -m "chore: SOS archive fetch results [skip ci]" || echo "nothing to commit"
          git push origin HEAD:sos-inspect
